<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard Demo</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        .weather-dashboard {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .dashboard-header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }
        .dashboard-header h1 {
            font-size: 42px;
            font-weight: 700;
            margin: 0 0 10px 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        .dashboard-header p {
            font-size: 18px;
            opacity: 0.9;
            margin: 0;
            font-weight: 300;
        }
        .city-input-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 30px;
        }
        .city-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            background: #fafafa;
        }
        .search-button {
            padding: 15px 25px;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .popular-cities h3 {
            margin: 0 0 20px 0;
            color: #2d3436;
            font-size: 18px;
            font-weight: 600;
        }
        .cities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }
        .city-button {
            padding: 12px 16px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            color: #495057;
        }
        .weather-display {
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            border-radius: 20px;
            padding: 30px;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            margin: 0 auto;
        }
        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
        }
        .location h2 {
            margin: 0 0 5px 0;
            font-size: 28px;
            font-weight: 600;
        }
        .timestamp {
            margin: 0;
            font-size: 14px;
            opacity: 0.8;
        }
        .weather-icon {
            font-size: 60px;
        }
        .temperature-section {
            text-align: center;
            margin-bottom: 40px;
        }
        .temperature {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            margin-bottom: 10px;
        }
        .temp-value {
            font-size: 72px;
            font-weight: 300;
            line-height: 1;
        }
        .temp-unit {
            font-size: 32px;
            font-weight: 300;
            margin-left: 8px;
            margin-top: 8px;
        }
        .feels-like {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        .description {
            font-size: 20px;
            font-weight: 500;
        }
        .weather-details {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }
        .detail-label {
            font-size: 14px;
            opacity: 0.8;
            font-weight: 500;
        }
        .detail-value {
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="weather-dashboard">
        <div class="dashboard-header">
            <h1>Weather Dashboard</h1>
            <p>Get current weather information for any city worldwide</p>
        </div>

        <div class="city-input-container">
            <div class="input-group">
                <input type="text" class="city-input" placeholder="Enter city name..." value="London">
                <button class="search-button">Get Weather</button>
            </div>
            <div class="popular-cities">
                <h3>Popular Cities</h3>
                <div class="cities-grid">
                    <button class="city-button">New York</button>
                    <button class="city-button">London</button>
                    <button class="city-button">Tokyo</button>
                    <button class="city-button">Paris</button>
                    <button class="city-button">Sydney</button>
                    <button class="city-button">Los Angeles</button>
                    <button class="city-button">Berlin</button>
                    <button class="city-button">Toronto</button>
                </div>
            </div>
        </div>

        <div class="weather-display">
            <div class="weather-header">
                <div class="location">
                    <h2>London, GB</h2>
                    <p class="timestamp">Last updated: 12/24/2024, 3:45:22 PM</p>
                </div>
                <div class="weather-icon">🌤️</div>
            </div>

            <div class="weather-main">
                <div class="temperature-section">
                    <div class="temperature">
                        <span class="temp-value">22</span>
                        <span class="temp-unit">°C</span>
                    </div>
                    <div class="feels-like">Feels like 24°C</div>
                    <div class="description">Partly cloudy</div>
                </div>
            </div>

            <div class="weather-details">
                <div class="detail-grid">
                    <div class="detail-item">
                        <span class="detail-label">Humidity</span>
                        <span class="detail-value">65%</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Pressure</span>
                        <span class="detail-value">1013 hPa</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Wind</span>
                        <span class="detail-value">3.2 m/s SW</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Visibility</span>
                        <span class="detail-value">10 km</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Clouds</span>
                        <span class="detail-value">40%</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Sunrise</span>
                        <span class="detail-value">7:45 AM</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Sunset</span>
                        <span class="detail-value">4:30 PM</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
